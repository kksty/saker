<!-- 占位图标（几何标记）：正式 logo 素材到位后整份替换，不自造图案。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Saker">
  <style>
    svg {
      --mark: #14161b;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --mark: #fff4ea;
      }
    }
  </style>
  <g stroke="var(--mark)" stroke-width="13" stroke-linecap="round">
    <path d="M100 100 L100 30"/>
    <path d="M100 100 L170 100"/>
    <path d="M100 100 L100 170"/>
    <path d="M100 100 L30 100"/>
  </g>
  <g fill="var(--mark)">
    <circle cx="100" cy="30" r="20"/>
    <circle cx="170" cy="100" r="20"/>
    <circle cx="100" cy="170" r="20"/>
    <circle cx="30" cy="100" r="20"/>
  </g>
  <circle cx="100" cy="100" r="28" fill="#e23325"/>
</svg>
