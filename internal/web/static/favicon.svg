  <style>
    svg { color: #14161b; }
    @media (prefers-color-scheme: dark) {
      svg { color: #eeeae1; }
    }
  </style>
  <g transform="translate(47.2 20) scale(1.6)" fill="none" stroke="currentColor">
    <path d="M58 22 C58 11 47 8 33 8 C18 8 8 14 8 26 C8 37 16 43 30 48 C45 53 55 59 55 71 C55 84 44 92 29 92 C14 92 8 86 8 74" stroke-width="16" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10"/>
  </g>
</svg>
